<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Читанка</title>
<meta name="description" content="Learn to read Ukrainian, one short lesson a day: a grammar point, a graded passage, new words and a quick check.">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@400;600&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="rain" aria-hidden="true"></canvas>
<div class="vignette" id="vig"></div>
<div class="stage" id="stage" tabindex="0" aria-live="polite">
  <div class="greet"><span class="txt" id="txt"></span><span class="caret" id="caret"></span></div>
</div>
<p class="hint" id="hint">Press <kbd>Enter</kbd> to jack in</p>
<button class="skip" id="skip" type="button">Skip</button>

<main class="app" id="app" aria-hidden="true">
  <div class="wrap">
    <header class="top"><h1>Читанка</h1>
      <div class="level"><span id="lvl">Lesson 1 / 40</span><span class="bar"><i id="barfill"></i></span><span id="streak">0-day streak</span></div></header>
    <nav class="settings" role="tablist" aria-label="Sections">
      <button class="tab" role="tab" id="tab-lesson" data-v="lesson" type="button">Lesson</button>
      <button class="tab" role="tab" id="tab-path" data-v="path" type="button">Path</button>
      <button class="tab" role="tab" id="tab-lexicon" data-v="lexicon" type="button">Lexicon</button>
      <span class="info" id="info"></span>
    </nav>
    <section class="view" id="view" aria-live="polite"></section>
    <p class="note">One new grammar point a day. Tap any sentence to see its English. Underlined letters mark the stressed vowel. Progress is kept in this browser.</p>
    <button class="replay" id="replay" type="button">Replay intro</button>
  </div>
</main>

<script src="js/lessons.js"></script>
<script src="js/app.js"></script>
</body>
</html>
